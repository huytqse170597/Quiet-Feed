<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet Feed video test</title><link rel="stylesheet" href="../../src/shared/theme.css"></head>
<body style="font:16px system-ui;margin:0;padding:16px;background:#252525;color:white">
  <h1>Quiet Feed video controls</h1>
  <p>Fixture only. No Facebook requests or downloads are made.</p>
  <div id="theme-toggle-mount" style="display:inline-block;margin-bottom:16px"></div>
  <div id="fixture-player-shell" style="box-sizing:border-box;width:min(500px,100%);height:260px;background:#111;padding:16px;overflow:hidden;transform:translateZ(0)">
    <span data-qf-video-id="123" style="display:none"></span>
    <div id="fixture-player" style="display:block;width:100%;height:180px;background:#313d46"></div>
    <p id="fixture-caption">Test video · 123</p>
  </div>
  <p id="result" role="status">Waiting for a user download action.</p>
  <script src="../../src/shared/features.js"></script>
  <script src="../../src/shared/video.js"></script>
  <script src="video-test-fixture.js"></script>
  <script src="../../src/shared/ui-components.js"></script>
  <script src="video-theme-preview.js"></script>
  <script src="../../src/video-page.js"></script>
  <script src="../../src/video-content.js"></script>
</body>
</html>
